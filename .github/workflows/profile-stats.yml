name: Update Profile Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Arnav-saini2007
          cards: overview,lifetime,contributions
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: "chore: update profile statistics [skip ci]"
